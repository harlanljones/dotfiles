# Codex project trust, rendered into ~/.codex/config.toml by
# dot_codex/private_config.toml.tmpl. `common` applies to every machine;
# a leading "~" expands to that machine's home directory.
#
# Codex appends [projects."…"] entries to config.toml itself when you trust a
# new directory. Because that file is a template, `chezmoi re-add` cannot
# absorb them -- add the path here instead, then `dots sync`.
