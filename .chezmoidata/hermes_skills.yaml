# Hermes default-profile skill library grouping.
#
# ~/.hermes/skills is synced across machines via the dot_hermes/skills/
# source tree (see AGENTS.md §6). It holds two kinds of entries, and the
# distinction matters when adding or removing skills:
#
#   local  — real directories under dot_hermes/skills/. Authored/installed
#            into Hermes directly (skill_manage, hermes skills). Edit these
#            in the source tree; after runtime edits on the authoritative
#            machine run `chezmoi re-add ~/.hermes/skills`.
#
#   linked — symlink_ entries pointing into the shared cross-harness pool
#            (~/.agents/skills), which run_onchange_before_09 /
#            run_after_23 install from .chezmoidata/agent_skills.yaml.
#            Content is owned by the shared pool; never edit the symlink
#            targets here — add or remove the skill in agent_skills.yaml.
#            Hermes-local skills must NOT be added to agent_skills.yaml.

local:
  - apple
  - autonomous-ai-agents
  - creative
  - devops
  - email
  - market-competitor-research
  - media
  - note-taking
  - productivity
  - ratatui-tui
  - repo-scaffold
  - research
  - social-media
  - software-development
  - sqlite
  - web
  - web-development

# Names only; each is a symlink_ file whose content is
# ../../.agents/skills/<name>, resolved after the shared pool is installed.
linked:
  - agent-reach
  - ai-image-generation
  - animate
  - animate-expo
  - animation-vocabulary
  - apple-design
  - ask-sonner
  - editor
  - emil-design-eng
  - find-animation-opportunities
  - flyai
  - improve-animations
  - pick-ui-library
  - review-animations
  - supabase
  - supabase-postgres-best-practices
  - unlazy
  - watch
  - write-swift
