# Theme registry for `dots theme`.
#
# Each key names a directory in .chezmoitemplates/themes/<key>/ holding the
# upstream per-tool ports (windows_terminal.json, lazygit.yml, delta.gitconfig,
# fzf.sh, eza.yml, bat.tmTheme, gemini.json), copied verbatim from the theme's
# extras. A machine selects one with machines.<machine>.theme.name; switching
# with `dots theme set <key>` edits that value and re-applies.
#
# Adding a theme: create the directory with all seven files, add an entry here,
# then `dots theme set <key>`.
themes:
  omarchy-kanagawa:
    label: "Omarchy Kanagawa"
    appearance: dark
    format: omarchy-v4
    source:
      kind: omarchy-public-theme
      name: "kanagawa"
      repo: "https://github.com/basecamp/omarchy/tree/master/themes/kanagawa"
      colorsSha256: "93c0ad7187196f39350b940b7e0f100305ab0c72aba19a621d696df715edb953"
      importedAt: "2026-09-14T00:21:45Z"
