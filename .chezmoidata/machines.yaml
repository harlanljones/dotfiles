machines:
  augustus:
    displayName: Augustus
    platform: omarchy
    hostname: omarchy
    role: "The foundational architect"
    backstory: "You built this machine from the ground up to establish order over the bare metal, making it the supreme ruler of your local network."
    theme:
      accent: "bold dimmed cyan"
    type: personal
    # Machine-identity banner data (phase 7.12). The wordmark is the
    # displayName itself, rendered by `dots-identity` via `figlet` using the
    # vendored Roman font (dot_local/share/figlet/Roman.flf). figlet is NOT a
    # hard dependency: without it the embedded mini-font wordmark is used.
    # Hardware stats are gathered live at render time, never stored here.
    identity:
      chips: ["foundational", "bare metal", "omarchy"]
    # Ghostty font size. Augustus drives a 4K panel at 1.6x scale, where 9pt
    # JetBrainsMono is already large; Hadrian is a 14" Retina laptop.
    ghostty:
      fontSize: 9
  hadrian:
    displayName: Hadrian
    platform: macos
    hostname: MacBookPro
    role: "The roaming administrator"
    backstory: "Hadrian spent most of his reign traveling the empire inspecting borders, making it a fitting title for a mobile, highly engineered Unix daily driver."
    theme:
      accent: "bold purple"
    type: work
    identity:
      chips: ["roaming", "mobile", "macos"]
    ghostty:
      fontSize: 14
  vespasian:
    displayName: Vespasian
    platform: wsl
    hostname: DESKTOP-UTOJEVB
    role: "The builder of the arena"
    # Ubuntu under WSL2 on the Windows gaming PC. No Omarchy base layer, no
    # desktop session: Windows owns the window manager and desktop tools; WSLg
    # may host Linux GUI apps such as Ghostty, and systemd owns portable Linux
    # daemons.
    backstory: "Vespasian restored order after a year of chaos and raised the Colosseum, making him the natural name for the box that hosts both the games and the work between them."
    type: personal
    identity:
      chips: ["builder", "WSL2", "dual-use"]
    theme:
      accent: "bold yellow"
      # Key into .chezmoidata/themes.yaml. Change with `dots theme set <name>`
      # (it edits this line and re-applies). Starship, opencode and Codex use
      # ANSI/system colors, so they follow the terminal scheme automatically.
      name: omarchy-tokyo-night
    # Windows Terminal remains the fallback box. The fragment written by
    # run_onchange_after_40-vespasian-windows-terminal.sh.tmpl updates the
    # WSL-generated Ubuntu profile in place (settings.json is never edited).
    windowsTerminal:
      profileGuid: "{cb4cd45f-28d6-5a0d-ad7e-0197f99e4ce9}"
      fontFace: "JetBrainsMono Nerd Font"
      fontSize: 11
      nerdFontsVersion: v3.5.1
    # Ghostty is rendered on Vespasian through WSLg; this value also keeps
    # template indexing .ghostty.fontSize total on every machine.
    ghostty:
      fontSize: 12
  unknown:
    displayName: Unknown
    platform: unknown
    hostname: ""
    role: "The unregistered host"
    # Fallback entry so templates can safely index .machines.<machine> when
    # the host is not one of the three registered machines (CI runners, a new
    # box before `chezmoi init` names it, etc.). Sane conservative defaults:
    # neutral starship accent, a theme name that exists in
    # .chezmoidata/themes.yaml (theme templates are vespasian-gated, so this
    # is only a guard against nil-pointer indexing), and a mid-size Ghostty
    # font that is readable on any panel until the machine is registered.
    type: personal
    headless: true
    identity:
      chips: ["unregistered"]
    theme:
      accent: "bold white"
      name: omarchy-tokyo-night
    ghostty:
      fontSize: 12
