# gitleaks config for the smoke-apply job's RENDERED-OUTPUT scan (CI task 2.7).
#
# The workflow stages every regular file reported by `chezmoi managed` after
# apply, preserving target-relative paths, and scans that staging directory with
# `--no-git`. This file is the single documented place to allow known-benign
# findings in rendered output. Repo history is scanned separately by the
# `secrets` job (which uses .gitleaksignore) — keep the two allowlists distinct.
#
# `useDefault = true` extends gitleaks' built-in ruleset; this config only
# adjusts the allowlist, it does not replace the rules.
[extend]
useDefault = true

# Managed runtime/cache paths that can trip generic rules without being secrets.
# Runner state and the checkout are not staged by the workflow and therefore do
# not need allowlisting here.
[[allowlists]]
description = "Managed runtime/cache paths that are not credentials"
paths = [
  '''(^|/)\.cache(/|$)''',
  '''(^|/)\.local/state(/|$)''',
  '''(^|/)\.local/share/\.cache(/|$)''',
  '''(^|/)\.npm(/|$)''',
  '''(^|/)\.bun(/|$)''',
  '''(^|/)\.cargo(/|$)''',
  '''(^|/)\.rustup(/|$)''',
  '''(^|/)\.go(/|$)''',
  '''(^|/)\.pyenv(/|$)''',
  '''(^|/)\.mise(/|$)''',
]

# Add future allowlisted rendered findings here, each with a comment naming
# the file and why the match is benign. Never allowlist an actual secret.
