name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Nightly: catch upstream breakage (tool installs, package repos, hook
  # scripts) between personal commits. Runs every job in this workflow.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared by the `secrets` and `smoke-apply` jobs so their gitleaks
  # installs cannot drift apart.
  GITLEAKS_VERSION: 8.21.2

jobs:
  # Matrix legs exercise each resolved machine on a plain ubuntu runner:
  #   augustus  — the template's Linux fallback (no hostname match), asserted
  #               rather than trusted;
  #   vespasian — pinned via sed on the rendered config, exercising WSL-only
  #               ignore/template paths;
  #   unknown   — an unrecognized host, pinned via sed, asserting that the
  #               Omarchy-only files are NOT in the apply plan (the fallback
  #               must not leak desktop config onto an unregistered machine).
  validate-linux:
    name: Validate (Linux, ${{ matrix.machine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: [augustus, vespasian, unknown]
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Render config and pin machine=${{ matrix.machine }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi execute-template --source "$GITHUB_WORKSPACE" -f .chezmoi.toml.tmpl > "$RUNNER_TEMP/chezmoi.toml"
          if [ "${{ matrix.machine }}" = augustus ]; then
            # The runner is not a registered hostname and not WSL, so the
            # Linux fallback must already resolve to augustus. Assert it.
            grep -q "^machine = 'augustus'$" "$RUNNER_TEMP/chezmoi.toml"
          else
            sed -E "s/^machine = '.*'$/machine = '${{ matrix.machine }}'/" \
              "$RUNNER_TEMP/chezmoi.toml" > "$RUNNER_TEMP/chezmoi-pinned.toml"
            grep -q "^machine = '${{ matrix.machine }}'$" "$RUNNER_TEMP/chezmoi-pinned.toml"
            mv "$RUNNER_TEMP/chezmoi-pinned.toml" "$RUNNER_TEMP/chezmoi.toml"
          fi

      - name: Dry-run apply as ${{ matrix.machine }} (encrypted entries excluded -- no age key in CI)
        # The unknown leg skips the full dry-run: many templates index
        # .machines by .machine (ghostty font size, theme names, ...), which
        # nil-pointers for machine=unknown. That latent gap is tracked
        # separately; here we cover what the fallback must already guarantee
        # (the ignore plan), which does not render those templates.
        if: matrix.machine != 'unknown'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi apply --config "$RUNNER_TEMP/chezmoi.toml" --source "$GITHUB_WORKSPACE" --dry-run --exclude encrypted

      # 2.6 unknown-machine fallback: with machine=unknown the Omarchy-only
      # config must be chezmoi-ignored, so the apply plan (`chezmoi managed`)
      # must not contain any of it, and .chezmoiignore.tmpl must still render
      # with the Omarchy-only trees listed (listing == excluded).
      - name: Assert unknown machine excludes Omarchy-only targets
        if: matrix.machine == 'unknown'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set -euo pipefail
          managed=$(chezmoi managed --config "$RUNNER_TEMP/chezmoi.toml" --source "$GITHUB_WORKSPACE" --exclude encrypted)
          leaked=$(printf '%s\n' "$managed" | grep -E '^\.config/(omarchy|pacman|btop)(/|$)' || true)
          if [ -n "$leaked" ]; then
            echo "::error::machine=unknown leaked Omarchy-only targets into the apply plan:"
            printf '%s\n' "$leaked"
            exit 1
          fi
          printf '%s\n' "$managed" | grep -q '^\.bashrc$' \
            || { echo "::error::machine=unknown did not apply .bashrc"; exit 1; }
          chezmoi execute-template --config "$RUNNER_TEMP/chezmoi.toml" \
            --source "$GITHUB_WORKSPACE" -f .chezmoiignore.tmpl > "$RUNNER_TEMP/ignore.txt"
          for tree in .config/omarchy .config/pacman .config/btop; do
            grep -qx "$tree" "$RUNNER_TEMP/ignore.txt" \
              || { echo "::error::.chezmoiignore does not exclude $tree under machine=unknown"; exit 1; }
          done
          echo "ok: machine=unknown excludes Omarchy-only targets and keeps .bashrc"

      - name: Verify dependency gate script renders and runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Reuse the pinned config from the render step so [data].machine is
          # present; bare execute-template has no .machine and fails after the
          # gating refactor.
          chezmoi execute-template --config "$RUNNER_TEMP/chezmoi.toml" --source "$GITHUB_WORKSPACE" < run_once_before_00-verify-deps.sh.tmpl > /tmp/verify-deps.sh
          sh -n /tmp/verify-deps.sh && sh /tmp/verify-deps.sh

  validate-macos:
    name: Validate (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Render config and pin machine=hadrian
        run: |
          # The darwin fallback already resolves to hadrian, but pin it via sed
          # so the job keeps exercising Hadrian's paths even if the fallback
          # order in .chezmoi.toml.tmpl changes.
          chezmoi execute-template --source "$GITHUB_WORKSPACE" -f .chezmoi.toml.tmpl > "$RUNNER_TEMP/chezmoi.toml"
          sed -E "s/^machine = '.*'$/machine = 'hadrian'/" "$RUNNER_TEMP/chezmoi.toml" > "$RUNNER_TEMP/chezmoi-pinned.toml"
          grep -q "^machine = 'hadrian'$" "$RUNNER_TEMP/chezmoi-pinned.toml"
          mv "$RUNNER_TEMP/chezmoi-pinned.toml" "$RUNNER_TEMP/chezmoi.toml"

      - name: Dry-run apply as hadrian (encrypted entries excluded -- no age key in CI)
        run: |
          chezmoi apply --config "$RUNNER_TEMP/chezmoi.toml" --source "$GITHUB_WORKSPACE" --dry-run --exclude encrypted

      # Hadrian-scoped templates are invisible to the Linux lint job (which
      # renders with an omarchy override), so macOS-only template errors would
      # otherwise only surface on the real machine. Render the macOS-defaults
      # hook with the hadrian pin and shellcheck it.
      - name: Shellcheck hadrian-scoped script
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sc_hadrian_defaults.sh"
          chezmoi execute-template --config "$RUNNER_TEMP/chezmoi.toml" --source "$GITHUB_WORKSPACE" \
            < run_onchange_after_30-hadrian-macos-defaults.sh.tmpl > "$out"
          [ -s "$out" ] || { echo "::error::hadrian defaults script rendered empty"; exit 1; }
          shellcheck -S warning "$out"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. The default shallow checkout gives the
      # scanner one commit, so it would pass on a repo whose history is full of
      # secrets -- a green check that proves nothing. The leak this job exists
      # to catch (812c7da) is 30+ commits back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact matters as much as the scan: without it a detection prints the
      # secret into a public CI log, so finding a leak would itself leak it.
      # Accepted historical findings live in .gitleaksignore, each documented.
      - name: Scan full history
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: Secret-scan exception regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 docs/test_gitleaks.py -v

  lint:
    name: Lint (shellcheck + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck yamllint zsh
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /tmp
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Install chezmoi (renders scripts for shellcheck)
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Shellcheck all managed scripts
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi execute-template --source "$PWD" -f .chezmoi.toml.tmpl > /tmp/chezmoi.toml
          status=0
          while IFS= read -r -d '' file; do
            # Review copies under docs/ are evidence, not managed scripts.
            case "$file" in
              docs/*|dotfiles-showcase/*) continue ;;
            esac
            case "$file" in
              *.sh|*.sh.tmpl|dot_local/bin/*.tmpl) ;;
              *) continue ;;
            esac
            if [[ "$file" == *.tmpl ]]; then
              out="/tmp/sc_$(echo "$file" | tr '/' '_')"
              chezmoi execute-template --config /tmp/chezmoi.toml --source "$PWD" --override-data '{"chezmoi":{"osRelease":{"id":"omarchy"}}}' < "$file" > "$out"
              target="$out"
            else
              target="$file"
            fi

            [ -s "$target" ] || continue

            if head -n 1 "$target" | grep -qE '^#!.*\b(sh|bash|dash|ksh)\b'; then
              echo "::group::shellcheck $file"
              # TODO: raise to -S style once the ~16 remaining style findings
              # (mostly SC2015/SC2016 in run_* hooks and vendored Hermes skill
              # scripts) are dispositioned; fixing hook scripts re-triggers
              # run_onchange_* applies, so it needs a deliberate pass.
              shellcheck -S warning "$target" || status=1
              echo "::endgroup::"
            fi
          done < <(git ls-files -z)
          exit $status

      - name: yamllint .chezmoidata
        run: yamllint -c .yamllint.yml .chezmoidata/

      - name: TOML parses (mise configs)
        run: |
          status=0
          for f in dot_config/mise/config.toml dot_config/mise/conf.d/*.toml; do
            [ -e "$f" ] || continue
            python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" "$f" \
              || { echo "::error::invalid TOML: $f"; status=1; }
          done
          exit $status

      - name: Dual-shell module checks (bash + zsh)
        run: docs/check-shell-modules.sh

      - name: actionlint
        run: actionlint -color

      - name: README structure tree is up to date
        run: python3 docs/generate_readme_tree.py --check

      - name: Dotfiles index is up to date
        run: python3 docs/generate_index.py --check

      - name: Install review test dependencies
        run: sudo apt-get install -y python3-yaml

      - name: Review tooling fixtures (never execute copied skill workflows)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 docs/skill-review/test_inventory.py -v
          python3 docs/skill-review/test_review.py -v
          python3 docs/skill-review/evaluations/test_local.py -v

  # 2.1 Real (non-dry-run) apply on Linux. Unlike the validate jobs, this
  # executes run_* hook scripts. Those do network installs, pacman operations
  # and Omarchy/desktop setup that cannot succeed on a bare ubuntu runner, so
  # hook failures are tolerated -- but ONLY hook failures. The post-apply
  # assertions below are strict, so a regression in the core dotfiles
  # (.zshrc, shell modules) still fails the job; a blanket `|| true` would not.
  smoke-apply:
    name: Smoke apply (Linux, real apply)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (chezmoi, age, zsh, gitleaks)
        run: |
          sudo apt-get update
          sudo apt-get install -y age zsh shellcheck
          curl -fsLS get.chezmoi.io | sh -s -- -b "$HOME/.local/bin"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          chezmoi --version
          gitleaks version

      - name: Render augustus config (encrypted entries hidden -- no age key)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # ubuntu-latest is neither a registered hostname nor WSL, so the
          # template's Linux fallback resolves to augustus -- the machine we
          # want to exercise. Assert it instead of trusting the fallback.
          chezmoi execute-template --source "$GITHUB_WORKSPACE" -f .chezmoi.toml.tmpl > "$RUNNER_TEMP/chezmoi.toml"
          grep -q "^machine = 'augustus'$" "$RUNNER_TEMP/chezmoi.toml"

      - name: Apply dotfiles (tolerate run_* hook failures only)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # A non-zero exit from apply is acceptable IFF it came from a run_*
          # hook script (network install, pacman-only command, missing desktop
          # bits on ubuntu). Any other failure -- template error, missing
          # source file, permission problem -- must fail the job.
          set +e
          chezmoi apply --config "$RUNNER_TEMP/chezmoi.toml" --source "$GITHUB_WORKSPACE" \
            --exclude encrypted 2>&1 | tee "$RUNNER_TEMP/apply.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -qE 'run_.*: exit status [1-9]' "$RUNNER_TEMP/apply.log"; then
              echo "::warning::apply exited $rc; failures were confined to run_* hook scripts (tolerated on ubuntu runner)"
              # Surface each tolerated hook failure in the job summary so a
              # nightly reviewer sees them at a glance instead of digging
              # through the apply log.
              {
                echo "### Tolerated run_* hook failures"
                grep -E 'run_.*: exit status [1-9]' "$RUNNER_TEMP/apply.log" | sed 's/^/- /'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "apply failed without a run_* hook cause -- see log:"
              cat "$RUNNER_TEMP/apply.log"
              exit 1
            fi
          fi

      - name: Assert rendered core dotfiles exist and parse (strict)
        run: |
          set -euo pipefail
          # NOTE: .zshrc is chezmoi-ignored on augustus (.chezmoiignore.tmpl
          # applies it only on hadrian); the augustus rc is .bashrc. The shell
          # modules under .config/shell are the real shared config, sourced by
          # BOTH bash and zsh -- assert they exist and parse under both shells
          # (zsh is installed in the tools step).
          test -f "$HOME/.bashrc" || { echo "::error::~/.bashrc was not applied"; exit 1; }
          test -d "$HOME/.config/shell" || { echo "::error::~/.config/shell was not applied"; exit 1; }
          sh_files=$(find "$HOME/.config/shell" -maxdepth 1 -name '*.sh' -print)
          [ -n "$sh_files" ] || { echo "::error::no shell modules applied under ~/.config/shell"; exit 1; }
          bash -n "$HOME/.bashrc"
          while IFS= read -r f; do
            bash -n "$f"
            zsh -n "$f"
            echo "ok: $f"
          done <<< "$sh_files"

      # 2.7 Scan the RENDERED output, not just the git repo. After apply, the
      # runner's $HOME holds exactly what a real machine would hold (minus
      # encrypted entries, which are excluded -- no age key here). --no-git
      # mode scans plain files; --redact keeps any finding out of the log.
      # Allowlist: .github/gitleaks-smoke.toml excludes runner noise dirs AND
      # the runner checkout itself (GITHUB_WORKSPACE sits under $HOME at
      # /home/runner/work/...), and is the single documented place to allow
      # known-benign rendered findings. The checkout is scanned separately by
      # the `secrets` job with .gitleaksignore.
      - name: Gitleaks scan of rendered output (~/.config/shell, ~/.zshrc, all of $HOME)
        run: |
          gitleaks detect --source "$HOME" --no-git --no-banner --redact \
            --exit-code 1 --config "$GITHUB_WORKSPACE/.github/gitleaks-smoke.toml"