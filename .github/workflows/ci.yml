name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux:
    name: Validate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Dry-run apply (encrypted entries excluded -- no age key in CI)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi execute-template --source "$GITHUB_WORKSPACE" -f .chezmoi.toml.tmpl > "$RUNNER_TEMP/chezmoi.toml"
          chezmoi apply --config "$RUNNER_TEMP/chezmoi.toml" --source "$GITHUB_WORKSPACE" --dry-run --exclude encrypted

      - name: Verify dependency gate script renders and runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi execute-template --source "$GITHUB_WORKSPACE" < run_once_before_00-verify-deps.sh.tmpl > /tmp/verify-deps.sh
          sh -n /tmp/verify-deps.sh && sh /tmp/verify-deps.sh

  validate-macos:
    name: Validate (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Dry-run apply (encrypted entries excluded -- no age key in CI)
        run: |
          chezmoi execute-template --source "$GITHUB_WORKSPACE" -f .chezmoi.toml.tmpl > "$RUNNER_TEMP/chezmoi.toml"
          chezmoi apply --config "$RUNNER_TEMP/chezmoi.toml" --source "$GITHUB_WORKSPACE" --dry-run --exclude encrypted

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. The default shallow checkout gives the
      # scanner one commit, so it would pass on a repo whose history is full of
      # secrets -- a green check that proves nothing. The leak this job exists
      # to catch (812c7da) is 30+ commits back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact matters as much as the scan: without it a detection prints the
      # secret into a public CI log, so finding a leak would itself leak it.
      # Accepted historical findings live in .gitleaksignore, each documented.
      - name: Scan full history
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

  lint:
    name: Lint (shellcheck + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /tmp
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Install chezmoi (renders scripts for shellcheck)
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Shellcheck all managed scripts
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          status=0
          for file in $(find . -name '*.sh' -o -name '*.sh.tmpl' -o -path './dot_local/bin/*' -name '*.tmpl' | sort -u); do
            if [[ "$file" == *.tmpl ]]; then
              out="/tmp/sc_$(echo "$file" | tr '/' '_')"
              chezmoi execute-template --source "$PWD" --override-data '{"chezmoi":{"osRelease":{"id":"omarchy"}}}' < "$file" > "$out"
              target="$out"
            else
              target="$file"
            fi

            [ -s "$target" ] || continue

            if head -n 1 "$target" | grep -qE '^#!.*\b(sh|bash|dash|ksh)\b'; then
              echo "::group::shellcheck $file"
              shellcheck -S warning "$target" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

      - name: actionlint
        run: actionlint -color

      - name: README structure tree is up to date
        run: python3 docs/generate_readme_tree.py --check

      - name: Dotfiles index is up to date
        run: python3 docs/generate_index.py --check
