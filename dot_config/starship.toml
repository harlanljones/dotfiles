add_newline = true
command_timeout = 200
format = "$username$hostname[$directory$git_branch$git_status$git_state${custom.git_dirty}]($style)$cmd_duration$git_commit$character"

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold cyan"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch]($style) "
style = "italic cyan"

[git_status]
format = '[$all_status]($style)'
style = "cyan"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = ""
modified = ""
stashed = ""
staged = ""
renamed = ""
deleted = ""

[custom.git_dirty]
command = "printf ''"
when = '''git status --porcelain --ignore-submodules=dirty | grep -Eq '^(\?\?|.[MT])' '''
format = "[$output]($style) "
style = "cyan"

[cmd_duration]
min_time = 3000
format = "[󰄉 $duration]($style) "
style = "bold cyan"

[git_commit]
only_detached = true
commit_hash_length = 7
format = "[($hash)]($style) "
style = "italic dimmed cyan"

[git_state]
format = "[($state( $progress_current/$progress_total))]($style) "
style = "bold cyan"

[username]
format = "[$user]($style)@"
style_user = "bold cyan"
style_root = "bold cyan"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold dimmed cyan"
